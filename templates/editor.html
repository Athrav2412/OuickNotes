<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Note' if note else 'New Note' }} - QuickNotes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <form method="POST" action="{{ url_for('edit_note', note_id=note.id) if note else url_for('add_note', subject_id=subject.id) }}" class="editor-layout">
        
        <header class="app-header editor-header">
            <div class="header-container">
                <a href="{{ url_for('subject_detail', subject_id=subject.id) }}" class="back-link">← {{ subject.name }}</a>
                <div class="header-actions">
                    <label class="fav-checkbox-label" title="Favorite">
                        <input type="checkbox" name="is_favorite" value="1" {{ 'checked' if note and note.is_favorite }}>
                        <span class="star-icon">★</span>
                    </label>
                    {% if note %}
                        <a href="{{ url_for('delete_note', note_id=note.id) }}" 
                           class="btn btn-danger-icon delete-confirm" 
                           data-confirm="Are you sure you want to delete this note?">
                            🗑️
                        </a>
                    {% endif %}
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </header>

        <main class="editor-container">
            <input type="text" 
                   name="title" 
                   class="editor-title-input" 
                   placeholder="Note Title" 
                   value="{{ note.title if note else '' }}" 
                   required 
                   autofocus>

            <textarea name="content" 
                      class="editor-textarea" 
                      placeholder="Start writing your note here...">{{ note.content if note else '' }}</textarea>
        </main>

    </form>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
