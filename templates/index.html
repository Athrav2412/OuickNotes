<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteNest - QuickNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
      --accent-glow: 0 4px 20px rgba(99, 102, 241, 0.35);
      --badge-math-bg: rgba(234, 179, 8, 0.12);
      --badge-math-text: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 90px;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      padding: 0 18px;
    }

    /* Top Brand Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      box-shadow: var(--accent-glow);
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 0 16px 0;
    }

    .page-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-icon {
      color: var(--accent-blue);
      display: flex;
    }

    .page-title {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Search Box */
    .search-container {
      position: relative;
      margin-bottom: 24px;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 6px 6px 6px 14px;
      transition: all 0.25s ease;
    }

    .search-wrapper:focus-within {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-icon {
      color: var(--text-muted);
      margin-right: 10px;
      display: flex;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    /* Primary Gradient Button */
    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Section Headings */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .section-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }

    .section-link:hover {
      opacity: 0.8;
    }

    /* Subjects Cards */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    .subject-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .subject-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .folder-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--badge-math-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--badge-math-text);
    }

    .subject-info .subject-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .subject-info .subject-count {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Recent Notes Cards */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      transition: all 0.25s ease;
      position: relative;
    }

    .note-card:hover {
      border-color: var(--card-hover-border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .note-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tag {
      background: var(--badge-math-bg);
      color: var(--badge-math-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.2px;
    }

    .star-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      transition: color 0.2s, transform 0.2s;
    }

    .star-btn:hover {
      color: #facc15;
      transform: scale(1.1);
    }

    .star-btn.active {
      color: #facc15;
    }

    .note-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .note-preview {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .note-date {
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-edit {
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-edit:hover {
      background: var(--accent-blue);
      color: #ffffff;
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 210px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .fab:hover {
      transform: scale(1.08) rotate(90deg);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.7);
    }

    @media (max-width: 480px) {
      .fab {
        right: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Header -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">N</div>
        <span class="brand-name">NoteNest</span>
      </div>
      <div class="profile-avatar" title="User Profile">N</div>
    </header>

    <!-- Sub Header -->
    <div class="page-header">
      <div class="page-title-group">
        <div class="page-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
        </div>
        <h1 class="page-title">QuickNotes</h1>
      </div>
      <button class="icon-btn" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input type="text" class="search-input" placeholder="Search notes by title or content...">
        <button class="btn-primary">Search</button>
      </div>
    </div>

    <!-- Subjects Section -->
    <section>
      <div class="section-head">
        <h2 class="section-title">Subjects</h2>
        <a href="#" class="section-link">
          Manage All (1) 
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>

      <div class="subjects-grid">
        <div class="subject-card">
          <div class="folder-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div class="subject-info">
            <div class="subject-name">Maths</div>
            <div class="subject-count">1 note</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Recent Notes Section -->
    <section>
      <div class="section-head">
        <h2 class="section-title">Recent Notes</h2>
      </div>

      <div class="notes-list">
        <div class="note-card">
          <div class="note-top">
            <span class="tag">Maths</span>
            <button class="star-btn" onclick="this.classList.toggle('active')" aria-label="Favorite">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
          </div>

          <h3 class="note-title">Home work 1</h3>
          <p class="note-preview">Empty note...</p>

          <div class="note-footer">
            <span class="note-date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
              2026-08-12
            </span>
            <button class="btn-edit">Edit</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating Action Button -->
    <button class="fab" aria-label="Add Note">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

  </div>

</body>
  </html>
